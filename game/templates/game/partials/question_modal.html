<style>
    .btn-option.selected {
        background: #4CAF50 !important;
    }
</style>
<div class="modal-overlay" id="question-modal-container"
     x-data="{ 
         selectedIndex: 0, 
         maxIndex: {% if monster_helps > 0 %}{% if question.option_4 %}4{% else %}3{% endif %}{% else %}{% if question.option_4 %}3{% else %}2{% endif %}{% endif %},
         usedHelp: false,
         handleKeydown(e) {
             if (e.key === 'ArrowDown') {
                 e.preventDefault();
                 this.selectedIndex = (this.selectedIndex < this.maxIndex) ? this.selectedIndex + 1 : 0;
             } else if (e.key === 'ArrowUp') {
                 e.preventDefault();
                 this.selectedIndex = (this.selectedIndex > 0) ? this.selectedIndex - 1 : this.maxIndex;
             } else if (e.key === 'Enter') {
                 e.preventDefault();
                 const buttons = Array.from(this.$el.querySelectorAll('.options .btn-option')).filter(b => b.style.display !== 'none');
                 if (buttons[this.selectedIndex]) {
                     buttons[this.selectedIndex].click();
                 }
             }
         }
     }"
     @keydown.window="handleKeydown($event)">
    <div class="modal-content" style="border-radius: 8px;">
        <h2>Un Mostro ti sfida!</h2>
        <p class="question-text">{{ question.text }}</p>
        <form hx-post="{% url 'game:answer' %}" hx-target="#question-modal-container" hx-swap="outerHTML">
            <input type="hidden" name="question_id" value="{{ question.id }}">
            <input type="hidden" name="x" value="{{ x }}">
            <input type="hidden" name="y" value="{{ y }}">
            
            <div class="options" style="pointer-events: none;">
                <button x-show="!usedHelp || !{{ eliminate_options|safe }}.includes(1)" type="submit" name="answer" value="1" class="btn-option" :class="{'selected': selectedIndex === 0}">{{ question.option_1 }}</button>
                <button x-show="!usedHelp || !{{ eliminate_options|safe }}.includes(2)" type="submit" name="answer" value="2" class="btn-option" :class="{'selected': selectedIndex === 1}">{{ question.option_2 }}</button>
                <button x-show="!usedHelp || !{{ eliminate_options|safe }}.includes(3)" type="submit" name="answer" value="3" class="btn-option" :class="{'selected': selectedIndex === 2}">{{ question.option_3 }}</button>
                {% if question.option_4 %}
                <button x-show="!usedHelp || !{{ eliminate_options|safe }}.includes(4)" type="submit" name="answer" value="4" class="btn-option" :class="{'selected': selectedIndex === 3}">{{ question.option_4 }}</button>
                {% endif %}
                
                {% if monster_helps > 0 %}
                <div style="margin-top: 15px; text-align: center;" x-show="!usedHelp">
                    <button type="button" class="btn-option" :class="{'selected': selectedIndex === (maxIndex)}" style="background-color: #9C27B0; border-color: #6A1B9A; font-size: 0.9rem; padding: 1vh 2vw;" @click="usedHelp = true; window.consumeMonsterHelp(); maxIndex -= 3; selectedIndex = 0;">
                        ✨ USA AIUTO (Ne hai {{ monster_helps }})
                    </button>
                </div>
                {% endif %}
            </div>
        </form>
    </div>
</div>
