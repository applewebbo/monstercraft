{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center;">
    <img src="{% static 'game/images/logo.jpg' %}" alt="MonsterCraft Logo" style="width: 450px; margin-bottom: 30px;">
    <p style="font-size: 1.2rem; margin-bottom: 40px; color: #ddd; max-width: 600px; line-height: 1.5;">
        Esplora il dungeon, rispondi alle domande dei mostri e sopravvivi alle trappole!<br>
        Quanti punti riuscirai a totalizzare?
    </p>
    <a href="{% url 'game:game' %}?level=1&score=0" class="btn-option" style="text-decoration: none; font-size: 1.2rem; padding: 15px 30px; display: inline-block; background-color: #F57C00; border-color: #E65100;">
        🎮 START GAME
    </a>
    <a href="{% url 'game:leaderboard' %}" class="btn-option" style="text-decoration: none; font-size: 1.2rem; padding: 15px 30px; display: inline-block; margin-top: 20px; background-color: #4CAF50; border-color: #388E3C;">
        🏆 LEADERBOARD
    </a>
</div>
{% endblock %}
