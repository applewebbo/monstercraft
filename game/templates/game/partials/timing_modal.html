<div class="modal-overlay" id="question-modal-container"
     x-data="{
        status: 'playing',
        cursorPos: 0,
        direction: 1,
        targetWidth: Math.max(5, 30 - (parseInt('{{ level }}') || 1) * 3),
        targetLeft: 0,
        speed: 1.5 + (parseInt('{{ level }}') || 1) * 0.25,
        animationId: null,

        init() {
            this.targetLeft = 50 - (this.targetWidth / 2);
            this.animate();
        },

        destroy() {
            if (this.animationId) cancelAnimationFrame(this.animationId);
        },

        handleKeydown(e) {
            if (e.code === 'Space' && this.status === 'playing') {
                e.preventDefault();
                this.hit();
            } else if (e.key === 'Enter' || e.key === ' ') {
                if (this.status === 'won') {
                    e.preventDefault();
                    resolveEncounter(true, {{ x }}, {{ y }});
                } else if (this.status === 'lost') {
                    e.preventDefault();
                    resolveEncounter(false, {{ x }}, {{ y }});
                }
            }
        },

        animate() {
            if (this.status !== 'playing') return;
            this.cursorPos += this.speed * this.direction;
            if (this.cursorPos >= 100) {
                this.cursorPos = 100;
                this.direction = -1;
            } else if (this.cursorPos <= 0) {
                this.cursorPos = 0;
                this.direction = 1;
            }
            this.animationId = requestAnimationFrame(() => this.animate());
        },

        hit() {
            if (this.status !== 'playing') return;
            if (this.cursorPos >= this.targetLeft && this.cursorPos <= (this.targetLeft + this.targetWidth)) {
                this.status = 'won';
            } else {
                this.status = 'lost';
            }
            this.destroy();
        }
     }"
     @keydown.window="handleKeydown($event)">
    <div class="modal-content">
        <h2>Colpo di Precisione!</h2>
        <p x-show="status === 'playing'">Ferma il cursore nell'area verde per colpire il mostro!</p>
        <p x-show="status === 'won'" class="text-success">Colpo Critico! Mostro sconfitto.</p>
        <p x-show="status === 'lost'" class="text-danger">Mancato! Il mostro ti colpisce.</p>

        <div x-show="status === 'playing'" style="position: relative; width: 100%; height: 30px; background-color: #333; margin: 2vh 0; border-radius: 15px; overflow: hidden; border: 2px solid #555;">
            <!-- Target Area -->
            <div :style="`position: absolute; left: ${targetLeft}%; width: ${targetWidth}%; height: 100%; background-color: #4CAF50;`"></div>
            <!-- Cursor -->
            <div :style="`position: absolute; left: ${cursorPos}%; width: 4px; height: 100%; background-color: #fff; box-shadow: 0 0 5px #fff; transform: translateX(-50%); z-index: 10;`"></div>
        </div>

        <button x-show="status === 'playing'" @click="hit()" @touchstart.prevent="hit()" class="btn-option bg-warning">COLPISCI!</button>

        <button x-show="status === 'won'" onclick="resolveEncounter(true, {{ x }}, {{ y }})" class="btn-option bg-success">Continua</button>
        <button x-show="status === 'lost'" onclick="resolveEncounter(false, {{ x }}, {{ y }})" class="btn-option bg-danger">Ritirati</button>
    </div>
</div>
