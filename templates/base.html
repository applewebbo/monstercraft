{% load static %}
<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
              content="MonsterCraft - Un gioco educativo in stile 8-bit.">
        <meta name="keywords" content="gioco, educativo, monstercraft, 8-bit">
        <title>{% block title %}MonsterCraft{% endblock title %}</title>
        <!-- Alpine.js -->
        <script defer
                src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
        <!-- HTMX -->
        <script src="https://unpkg.com/htmx.org@1.9.10"
                integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
                crossorigin="anonymous"></script>
        <!-- Google Fonts for 8-bit style -->
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
              rel="stylesheet">
        <!-- Custom CSS -->
        <link rel="stylesheet" href="{% static 'game/css/custom.css' %}">
        <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 2vh;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .btn-option {
            font-family: 'Press Start 2P', cursive;
            background: #333;
            color: #fff;
            border: 2px solid #fff;
            padding: 15px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0px 4px 0px #FF9800;
            transition: all 0.1s ease;
            text-align: center;
        }
        .btn-option:hover {
            background: #4CAF50;
        }
        .btn-option:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px #FF9800;
        }
        </style>
        {% block extra_head %}
        {% endblock extra_head %}
    </head>
    <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
        <canvas id="hyperspace-canvas" class="hyperspace-bg"></canvas>
        <script>
        (function(){
            const canvas = document.getElementById('hyperspace-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;

            function resize() {
                const ratio = window.innerWidth / window.innerHeight;
                height = canvas.height = 180;
                width = canvas.width = Math.floor(180 * ratio);
            }
            window.addEventListener('resize', resize);
            resize();

            const numStars = 150;
            const stars = [];

            for (let i = 0; i < numStars; i++) {
                stars.push({
                    x: Math.random() * 2000 - 1000,
                    y: Math.random() * 2000 - 1000,
                    z: Math.random() * 2000,
                    color: '#ffffff'
                });
            }

            function draw() {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, width, height);

                const cx = width / 2;
                const cy = height / 2;

                for (let i = 0; i < numStars; i++) {
                    let star = stars[i];
                    star.z -= 100;

                    if (star.z <= 1) {
                        star.z = 2000;
                        star.x = Math.random() * 2000 - 1000;
                        star.y = Math.random() * 2000 - 1000;
                    }

                    let x = Math.floor(cx + (star.x / star.z) * width);
                    let y = Math.floor(cy + (star.y / star.z) * width);
                    let size = Math.max(1, Math.floor((1 - star.z / 2000) * 3));

                    ctx.fillStyle = star.color;
                    ctx.fillRect(x, y, size, size);
                }

                requestAnimationFrame(draw);
            }
            draw();
        })();
        </script>
        {% block content %}
        {% endblock content %}
    </body>
</html>
