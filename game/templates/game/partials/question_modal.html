<div class="modal-overlay" id="question-modal-container"
     x-data="{
         usedHelp: false,
         init() {
             this.$nextTick(() => { this.updateSelection(); });
         },
         updateSelection() {
             const buttons = Array.from(this.$el.querySelectorAll('.options button')).filter(b => b.style.display !== 'none');
             buttons.forEach((b, i) => {
                 if (i === 0) b.classList.add('selected');
                 else b.classList.remove('selected');
             });
         },
         handleKeydown(e) {
             const buttons = Array.from(this.$el.querySelectorAll('.options button')).filter(b => b.style.display !== 'none');
             if (buttons.length === 0) return;

             let currentIndex = buttons.findIndex(b => b.classList.contains('selected'));
             if (currentIndex === -1) currentIndex = 0;

             if (e.key === 'ArrowDown') {
                 e.preventDefault();
                 currentIndex = (currentIndex < buttons.length - 1) ? currentIndex + 1 : 0;
             } else if (e.key === 'ArrowUp') {
                 e.preventDefault();
                 currentIndex = (currentIndex > 0) ? currentIndex - 1 : buttons.length - 1;
             } else if (e.key === 'Enter') {
                 e.preventDefault();
                 buttons[currentIndex].click();
                 return;
             } else {
                 return;
             }

             buttons.forEach(b => b.classList.remove('selected'));
             buttons[currentIndex].classList.add('selected');
         }
     }"
     @keydown.window="handleKeydown($event)">
    <div class="modal-content">
        <h2>Un Mostro ti sfida!</h2>
        <p class="question-text">{{ question.text }}</p>
        <form hx-post="{% url 'game:answer' %}" hx-target="#question-modal-container" hx-swap="outerHTML">
            <input type="hidden" name="question_id" value="{{ question.id }}">
            <input type="hidden" name="x" value="{{ x }}">
            <input type="hidden" name="y" value="{{ y }}">

            <div class="options">
                <button x-show="!usedHelp || !{{ eliminate_options|safe }}.includes(1)" type="submit" name="answer" value="1" class="btn-option">{{ question.option_1 }}</button>
                <button x-show="!usedHelp || !{{ eliminate_options|safe }}.includes(2)" type="submit" name="answer" value="2" class="btn-option">{{ question.option_2 }}</button>
                <button x-show="!usedHelp || !{{ eliminate_options|safe }}.includes(3)" type="submit" name="answer" value="3" class="btn-option">{{ question.option_3 }}</button>
                {% if question.option_4 %}
                <button x-show="!usedHelp || !{{ eliminate_options|safe }}.includes(4)" type="submit" name="answer" value="4" class="btn-option">{{ question.option_4 }}</button>
                {% endif %}

                {% if monster_helps > 0 %}
                <div style="margin-top: 15px; text-align: center;" x-show="!usedHelp">
                    <button type="button" class="btn-option bg-warning" @click="usedHelp = true; window.consumeMonsterHelp(); $nextTick(() => updateSelection());">
                        ✨ USA AIUTO (Ne hai {{ monster_helps }})
                    </button>
                </div>
                {% endif %}
            </div>
        </form>
    </div>
</div>
