{% load static %}
<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
              content="MonsterCraft - Un gioco educativo in stile 8-bit.">
        <meta name="keywords" content="gioco, educativo, monstercraft, 8-bit">
        <title>{% block title %}MonsterCraft{% endblock title %}</title>
        <!-- Alpine.js -->
        <script defer
                src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
        <!-- HTMX -->
        <script src="https://unpkg.com/htmx.org@1.9.10"
                integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
                crossorigin="anonymous"></script>
        <!-- Google Fonts for 8-bit style -->
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
              rel="stylesheet">
        <!-- Custom CSS -->
        <link rel="stylesheet" href="{% static 'game/css/custom.css' %}">
        <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 2vh;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .btn-option {
            font-family: 'Press Start 2P', cursive;
            background: #333;
            color: #fff;
            border: 2px solid #fff;
            padding: 15px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0px 4px 0px #FF9800;
            transition: all 0.1s ease;
            text-align: center;
        }
        .btn-option:hover {
            background: #4CAF50;
        }
        .btn-option:active {
            transform: translateY(4px);
            box-shadow: 0px 0px 0px #FF9800;
        }
        </style>
        {% block extra_head %}
        {% endblock extra_head %}
    </head>
    <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
        {% block content %}
        {% endblock content %}
    </body>
</html>
