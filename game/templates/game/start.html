{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; box-sizing: border-box;">
    <img src="{% static 'game/images/logo.jpg' %}" alt="MonsterCraft Logo" style="width: 100%; max-width: 450px; max-height: 30vh; object-fit: contain; margin-bottom: 2vh;">
    <p style="font-size: clamp(0.8rem, 2vh, 1.2rem); margin-bottom: 3vh; color: #ddd; max-width: 600px; line-height: 1.5;">
        Esplora il dungeon, rispondi alle domande dei mostri e sopravvivi alle trappole!<br>
        Quanti punti riuscirai a totalizzare?
    </p>
    <form action="{% url 'game:start' %}" method="POST" style="display: flex; flex-direction: column; align-items: center; gap: 2vh;">
        {% csrf_token %}
        <div style="margin-bottom: 10px;">
            <label for="age_group" style="font-size: 1rem; color: #FFEB3B; margin-right: 15px; font-family: 'Press Start 2P', cursive;">Fascia d'Età:</label>
            <select name="age_group" id="age_group" style="padding: 10px; font-size: 0.8rem; border-radius: 5px; background: #333; color: white; border: 2px solid #555; font-family: 'Press Start 2P', cursive;">
                <option value="5-8">5-8 anni</option>
                <option value="9-12" selected>9-12 anni</option>
                <option value="13-17">13-17 anni</option>
                <option value="ADULT">Adulto</option>
            </select>
        </div>
        <button type="submit" class="btn-option" style="font-size: clamp(1rem, 2.5vh, 1.2rem); padding: 2vh 4vw; display: inline-block; background-color: #F57C00; border-color: #E65100; cursor: pointer;">
            🎮 START GAME
        </button>
    </form>
    <a href="{% url 'game:leaderboard' %}" class="btn-option" style="text-decoration: none; font-size: clamp(1rem, 2.5vh, 1.2rem); padding: 2vh 4vw; display: inline-block; margin-top: 2vh; background-color: #4CAF50; border-color: #388E3C;">
        🏆 LEADERBOARD
    </a>
</div>
{% endblock %}
